name: architecture-lab-tests

# Runs the shared BDD acceptance suite against a backend implementation:
#
#   BACKEND=02-clean-architecture docker compose -f docker-compose.test.yml up --build \
#     --abort-on-container-exit --exit-code-from acceptance
#
# The acceptance suite lives in shared/acceptance and is implementation-agnostic.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        BACKEND_DIR: ${BACKEND:-01-layered-ntier}
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/projects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  acceptance:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./shared/acceptance:/app
    environment:
      BACKEND_URL: http://backend:3000
    command: sh -c "npm ci && npm test"
    depends_on:
      backend:
        condition: service_healthy

volumes: {}
