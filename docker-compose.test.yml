version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/${BACKEND:-01-layered-ntier}/Dockerfile
      args:
        BACKEND_DIR: ${BACKEND:-01-layered-ntier}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow
      JWT_SECRET: dev-secret-change-in-production
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
