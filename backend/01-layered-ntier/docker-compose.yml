name: architecture-lab-01-layered

# Convenience stack for a single implementation: the Layered/N-tier backend
# plus its own PostgreSQL. Run it from this directory:
#
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: docker/backend.Dockerfile
      args:
        BACKEND_DIR: 01-layered-ntier
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
