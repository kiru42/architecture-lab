version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: backend/01-layered-ntier/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public"
      JWT_SECRET: "dev-secret-change-in-production"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma migrate deploy --schema=../../shared/prisma/schema.prisma &&
        node dist/main
      "

volumes:
  postgres_data:
