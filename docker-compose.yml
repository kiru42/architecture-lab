name: architecture-lab

# Boot any backend + frontend pair against a shared PostgreSQL:
#
#   BACKEND=05-ddd FRONTEND=03-feature-sliced-design docker compose up --build
#   BACKEND=02-clean-architecture FRONTEND=02-clean-architecture docker compose up --build
#
# Backend implementations: 01-layered-ntier, 02-clean-architecture, 03-hexagonal,
#                          04-onion, 05-ddd, 06-cqrs-es, 07-modular-monolith
# Frontend implementations: 01-component-layered, 02-clean-architecture,
#                           03-feature-sliced-design, 04-atomic-only
#
# Frontend is served on http://localhost:5173 and proxies /api to the backend.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        BACKEND_DIR: ${BACKEND:-01-layered-ntier}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_DIR: ${FRONTEND:-01-component-layered}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
