name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job here is blocking. If a step can fail without failing the build it is
# not a check, it is decoration — which is exactly how three implementations sat
# broken for months behind a green badge.

jobs:
  # ---------------------------------------------------------------------------
  # Cheap invariant checks that do not need a component matrix.
  # ---------------------------------------------------------------------------
  hygiene:
    name: Shared contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every backend ships the shared Prisma schema and migrations
        run: ./scripts/check-prisma-sync.sh

  # ---------------------------------------------------------------------------
  # Lint, typecheck, build and unit-test all eleven implementations.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: hygiene
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend/01-layered-ntier
          - backend/02-clean-architecture
          - backend/03-hexagonal
          - backend/04-onion
          - backend/05-ddd
          - backend/06-cqrs-es
          - backend/07-modular-monolith
          - frontend/01-component-layered
          - frontend/02-clean-architecture
          - frontend/03-feature-sliced-design
          - frontend/04-atomic-design

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Generate Prisma client
        if: contains(matrix.component, 'backend')
        working-directory: ${{ matrix.component }}
        run: npm run prisma:generate

      - name: Lint
        working-directory: ${{ matrix.component }}
        run: |
          if compgen -G ".eslintrc*" > /dev/null || compgen -G "eslint.config.*" > /dev/null; then
            npm run lint
          else
            echo "::notice::No ESLint config in ${{ matrix.component }} — lint is not gated here yet."
          fi

      - name: Type check
        working-directory: ${{ matrix.component }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.component }}
        run: npm run build

      - name: Unit tests
        working-directory: ${{ matrix.component }}
        run: npm test

  # ---------------------------------------------------------------------------
  # The real gate: the shared BDD suite, run against every backend.
  #
  # This is the job that proves the implementations agree with each other and
  # with shared/openapi.yaml. It used to be hardcoded to `if: false`.
  # ---------------------------------------------------------------------------
  acceptance:
    name: acceptance / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        backend:
          - 01-layered-ntier
          - 02-clean-architecture
          - 03-hexagonal
          - 04-onion
          - 05-ddd
          - 06-cqrs-es
          - 07-modular-monolith

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
      JWT_SECRET: ci-secret-not-for-production
      PORT: '3000'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/${{ matrix.backend }}/package-lock.json
            shared/acceptance/package-lock.json

      - name: Install backend
        working-directory: backend/${{ matrix.backend }}
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend/${{ matrix.backend }}
        run: npm run prisma:generate

      - name: Build backend
        working-directory: backend/${{ matrix.backend }}
        run: npm run build

      - name: Apply migrations
        working-directory: backend/${{ matrix.backend }}
        run: npm run prisma:deploy

      - name: Install acceptance suite
        working-directory: shared/acceptance
        run: npm ci

      - name: Boot the backend and run the shared acceptance suite
        env:
          BACKEND_URL: http://localhost:3000
        run: |
          cd "backend/${{ matrix.backend }}"

          nohup node dist/main > /tmp/backend.log 2>&1 &
          BACKEND_PID=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null --max-time 2 "$BACKEND_URL/projects"; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::backend/${{ matrix.backend }} never became reachable"
            tail -60 /tmp/backend.log
            kill "$BACKEND_PID" 2>/dev/null || true
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/shared/acceptance"
          set +e
          npm test
          status=$?
          set -e

          echo "----- backend log (tail) -----"
          tail -40 /tmp/backend.log
          kill "$BACKEND_PID" 2>/dev/null || true

          exit $status

  # ---------------------------------------------------------------------------
  # The frontend gate: the shared end-to-end suite, driven through a real
  # browser against a real backend.
  #
  # The backend is fixed to 01-layered-ntier because it is the only
  # implementation with a WebSocket gateway, and the notification scenario
  # needs one. The frontend is what varies: each implementation is judged on
  # its own ability to drive the same contract through its own UI.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e / ${{ matrix.frontend }}
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - 01-component-layered
          - 02-clean-architecture
          - 03-feature-sliced-design
          - 04-atomic-design

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
      JWT_SECRET: ci-secret-not-for-production
      PORT: '3000'
      FRONTEND_PORT: '5199'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            backend/01-layered-ntier/package-lock.json
            frontend/${{ matrix.frontend }}/package-lock.json
            shared/e2e/package-lock.json

      - name: Install backend
        working-directory: backend/01-layered-ntier
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend/01-layered-ntier
        run: npm run prisma:generate

      - name: Build backend
        working-directory: backend/01-layered-ntier
        run: npm run build

      - name: Apply migrations
        working-directory: backend/01-layered-ntier
        run: npm run prisma:deploy

      - name: Install frontend
        working-directory: frontend/${{ matrix.frontend }}
        run: npm ci

      - name: Install e2e suite
        working-directory: shared/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Boot the backend and the frontend, then run the shared e2e suite
        run: |
          ( cd backend/01-layered-ntier
            nohup node dist/main > /tmp/backend.log 2>&1 &
            echo $! > /tmp/backend.pid )

          ( cd frontend/${{ matrix.frontend }}
            API_PROXY_TARGET=http://localhost:3000 \
              nohup npx vite --port "$FRONTEND_PORT" --strictPort \
              > /tmp/frontend.log 2>&1 &
            echo $! > /tmp/frontend.pid )

          wait_for() {
            for _ in $(seq 1 "$2"); do
              curl -s -o /dev/null --max-time 2 "$1" && return 0
              sleep 2
            done
            return 1
          }

          if ! wait_for http://localhost:3000/projects 45; then
            echo "::error::backend never became reachable"
            tail -60 /tmp/backend.log
            exit 1
          fi

          if ! wait_for "http://localhost:$FRONTEND_PORT" 45; then
            echo "::error::frontend never became reachable"
            tail -60 /tmp/frontend.log
            exit 1
          fi

          set +e
          ( cd shared/e2e
            FRONTEND_URL="http://localhost:$FRONTEND_PORT" \
            API_URL=http://localhost:3000 \
            npx playwright test )
          status=$?
          set -e

          echo "----- frontend log (tail) -----"
          tail -30 /tmp/frontend.log
          echo "----- backend log (tail) -----"
          tail -30 /tmp/backend.log

          kill "$(cat /tmp/frontend.pid)" 2>/dev/null || true
          kill "$(cat /tmp/backend.pid)" 2>/dev/null || true

          exit $status

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.frontend }}
          path: shared/e2e/playwright-report
          retention-days: 7
