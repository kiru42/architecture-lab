name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - backend/01-layered-ntier
          - backend/02-clean-architecture
          - backend/03-hexagonal
          - backend/04-onion
          - backend/05-ddd
          - backend/06-cqrs-event-sourcing
          - backend/07-modular-monolith
          - frontend/01-component-layered
          - frontend/02-clean-architecture
          - frontend/03-feature-sliced-design
          - frontend/04-atomic-only

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Check if component exists
        id: check
        run: |
          if [ -d "${{ matrix.component }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: npm run lint

      - name: Type check
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: npm run typecheck

      - name: Unit tests
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: npm test -- --coverage

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install acceptance tests
        working-directory: shared/acceptance
        run: npm ci

      - name: Run acceptance tests
        working-directory: shared/acceptance
        env:
          BACKEND_URL: http://localhost:3000
        run: npm test
